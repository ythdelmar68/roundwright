name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build clean wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check pipx uv
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify isolated pip, pipx, and uv installations
        run: python ci/verify_installs.py dist
      - name: Record and validate exact push evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          python ci/record_hosted_evidence.py --repository "$GITHUB_REPOSITORY" --workflow "CI" --head "$GITHUB_SHA" --ref "$GITHUB_REF" --artifact-dir dist > dist/hosted-evidence.json
          python ci/validate_hosted_evidence.py --record dist/hosted-evidence.json --repository "$GITHUB_REPOSITORY" --workflow "CI" --head "$GITHUB_SHA" --branch "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: roundwright-${{ matrix.os }}-${{ github.sha }}
          path: dist/
