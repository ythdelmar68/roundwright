# Docker consumes host-owned material and never creates authority or publishes images.
x-roundwright-build: &roundwright-build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    ROUNDWRIGHT_WHEEL: ${ROUNDWRIGHT_WHEEL:?set the exact wheel filename}
    ROUNDWRIGHT_WHEEL_SHA256: ${ROUNDWRIGHT_WHEEL_SHA256:?set the exact sha256 digest}
    ROUNDWRIGHT_CANDIDATE_SHA: ${ROUNDWRIGHT_DOCKER_CANDIDATE_SHA:?set the exact candidate sha}
    ROUNDWRIGHT_BASE_IMAGE_DIGEST: sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2

x-roundwright-runtime: &roundwright-runtime
  image: roundwright-consumer:local
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp
  environment:
    ROUNDWRIGHT_DOCKER_CANDIDATE_SHA: ${ROUNDWRIGHT_DOCKER_CANDIDATE_SHA:?set the exact candidate sha}
    ROUNDWRIGHT_DOCKER_PACKAGE_SHA256: ${ROUNDWRIGHT_WHEEL_SHA256:?set the exact wheel sha256 digest}
    ROUNDWRIGHT_DOCKER_BASE_IMAGE_DIGEST: sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
  command: ["doctor"]

services:
  roundwright-authoritative:
    <<: *roundwright-runtime
    build: *roundwright-build
    environment:
      ROUNDWRIGHT_DOCKER_MODE: authoritative
      ROUNDWRIGHT_DOCKER_CANDIDATE_SHA: ${ROUNDWRIGHT_DOCKER_CANDIDATE_SHA:?set the exact candidate sha}
      ROUNDWRIGHT_DOCKER_PACKAGE_SHA256: ${ROUNDWRIGHT_WHEEL_SHA256:?set the exact wheel sha256 digest}
      ROUNDWRIGHT_DOCKER_BASE_IMAGE_DIGEST: sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
      ROUNDWRIGHT_DOCKER_AUTHORITY_RECEIPT_SHA256: ${ROUNDWRIGHT_DOCKER_AUTHORITY_RECEIPT_SHA256:?set the typed receipt sha256 digest}
    volumes:
      - ${ROUNDWRIGHT_REPOSITORY:?set the canonical repository}:/workspace:ro
      - ${ROUNDWRIGHT_STATE:?set the authoritative state directory}:/var/lib/roundwright:rw
      - ${ROUNDWRIGHT_CONFIGURATION:?set the typed configuration file}:/etc/roundwright/config.toml:ro
      - ${ROUNDWRIGHT_AUTHENTICATION:?set the operator-provided authentication file}:/run/roundwright/auth.toml:ro
      - ${ROUNDWRIGHT_AUTHORITY_RECEIPT:?set the typed authority receipt}:/run/roundwright/authority-receipt.json:ro
  roundwright-read-only:
    <<: *roundwright-runtime
    build: *roundwright-build
    environment:
      ROUNDWRIGHT_DOCKER_MODE: read-only
      ROUNDWRIGHT_DOCKER_CANDIDATE_SHA: ${ROUNDWRIGHT_DOCKER_CANDIDATE_SHA:?set the exact candidate sha}
      ROUNDWRIGHT_DOCKER_PACKAGE_SHA256: ${ROUNDWRIGHT_WHEEL_SHA256:?set the exact wheel sha256 digest}
      ROUNDWRIGHT_DOCKER_BASE_IMAGE_DIGEST: sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
    volumes:
      - ${ROUNDWRIGHT_REPOSITORY:?set the canonical repository}:/workspace:ro
      - ${ROUNDWRIGHT_STATE:?set the authoritative state directory}:/var/lib/roundwright:ro
      - ${ROUNDWRIGHT_CONFIGURATION:?set the typed configuration file}:/etc/roundwright/config.toml:ro
      - ${ROUNDWRIGHT_AUTHENTICATION:?set the operator-provided authentication file}:/run/roundwright/auth.toml:ro
  roundwright-test-only:
    <<: *roundwright-runtime
    build: *roundwright-build
    environment:
      ROUNDWRIGHT_DOCKER_MODE: test-only
      ROUNDWRIGHT_DOCKER_CANDIDATE_SHA: ${ROUNDWRIGHT_DOCKER_CANDIDATE_SHA:?set the exact candidate sha}
      ROUNDWRIGHT_DOCKER_PACKAGE_SHA256: ${ROUNDWRIGHT_WHEEL_SHA256:?set the exact wheel sha256 digest}
      ROUNDWRIGHT_DOCKER_BASE_IMAGE_DIGEST: sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
    volumes:
      - ${ROUNDWRIGHT_REPOSITORY:?set the canonical repository}:/workspace:ro
      - ${ROUNDWRIGHT_STATE:?set the authoritative state directory}:/var/lib/roundwright:ro
      - ${ROUNDWRIGHT_CONFIGURATION:?set the typed configuration file}:/etc/roundwright/config.toml:ro
      - ${ROUNDWRIGHT_AUTHENTICATION:?set the operator-provided authentication file}:/run/roundwright/auth.toml:ro
